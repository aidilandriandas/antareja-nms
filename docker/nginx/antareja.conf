# ANTAREJA NMS — reverse proxy (satu-satunya pintu masuk dari jaringan pengguna)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/antareja.crt;
    ssl_certificate_key /etc/nginx/certs/antareja.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    # Resolve ulang nama container "app" lewat DNS Docker: IP app bisa berubah saat container di-restart
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $antareja_app http://app:8000;

    # ---------- Live view CCTV ----------
    # Video lewat WebSocket ke gateway internal (go2rtc). Setiap koneksi diperiksa dulu oleh ANTAREJA:
    # user harus login, punya hak live view, dan stream harus milik kamera yang boleh dilihat.
    set $antareja_video http://go2rtc:1984;

    location = /antareja/live/ws {
        auth_request /_antareja_live_auth;
        proxy_pass         $antareja_video/api/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Pemutar video (JavaScript statis bawaan go2rtc, lisensi MIT)
    location ~ ^/antareja/live/(video-rtc|video-stream)\.js$ {
        proxy_pass $antareja_video/$1.js;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /_antareja_live_auth {
        internal;
        proxy_pass              $antareja_app/antareja/cctv/live-auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length    "";
        proxy_set_header        X-Original-URI    $request_uri;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        X-Forwarded-Port  443;
    }

    location / {
        proxy_pass         $antareja_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 300s;
    }
}
