# ANTAREJA NMS — Docker Compose (satu VM Ubuntu Server LTS / Proxmox)
# Jalankan lewat skrip: ./antareja.sh start   (lihat docs/INSTALL.md)
name: antareja

x-app-env: &app-env
  TZ: ${TZ}
  PUID: "1000"
  PGID: "1000"
  DB_HOST: db
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_TIMEOUT: "60"
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  RRDCACHED_SERVER: rrdcached:42217
  LIBRENMS_SNMP_COMMUNITY: ${SNMP_COMMUNITY_LOCAL}
  MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
  MAX_INPUT_VARS: "1000"
  UPLOAD_MAX_SIZE: 16M
  OPCACHE_MEM_SIZE: "128"
  REAL_IP_FROM: 0.0.0.0/0
  REAL_IP_HEADER: X-Forwarded-For
  LOG_IP_VAR: http_x_forwarded_for
  LISTEN_IPV6: ${LISTEN_IPV6:-false}
  # Percayai header X-Forwarded-* hanya dari jaringan internal Docker (Nginx reverse proxy)
  APP_TRUSTED_PROXIES: ${DOCKER_SUBNET:-172.30.250.0/24}
  ANTAREJA_PUBLIC_URL: https://${SERVER_NAME}
  # Asisten AI opsional — kunci hanya di server, tidak pernah dikirim ke browser
  ANTAREJA_AI_KEY: ${ANTAREJA_AI_KEY:-}
  ANTAREJA_AI_MODEL: ${ANTAREJA_AI_MODEL:-claude-opus-5-5}
  ANTAREJA_AI_BASE_URL: ${ANTAREJA_AI_BASE_URL:-}

services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    command:
      - mariadbd
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - redis-data:/data
    networks: [backend]

  rrdcached:
    image: crazymax/rrdcached:1.9.0-r4
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      LOG_LEVEL: LOG_INFO
      WRITE_TIMEOUT: "1800"
      WRITE_JITTER: "1800"
      WRITE_THREADS: "4"
      FLUSH_DEAD_DATA_INTERVAL: "3600"
    volumes:
      - rrd-data:/data/db
      - rrd-journal:/data/journal
    networks: [backend]

  app:
    image: antareja-nms:${ANTAREJA_TAG}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Proxy keluar saat build (opsional, mis. jaringan kantor tambang); kosong = langsung
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        LIBRENMS_VERSION: ${LIBRENMS_VERSION}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
    restart: unless-stopped
    hostname: antareja
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rrdcached:
        condition: service_started
    environment:
      <<: *app-env
    volumes:
      - app-data:/data
      - rrd-data:/data/rrd
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  dispatcher:
    image: antareja-nms:${ANTAREJA_TAG}
    restart: unless-stopped
    hostname: antareja-dispatcher
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      SIDECAR_DISPATCHER: "1"
      DISPATCHER_NODE_ID: dispatcher1
    volumes:
      - app-data:/data
      - rrd-data:/data/rrd
    networks: [backend]

  snmptrapd:
    image: antareja-nms:${ANTAREJA_TAG}
    profiles: [traps]
    restart: unless-stopped
    hostname: antareja-snmptrapd
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      SIDECAR_SNMPTRAPD: "1"
    ports:
      - "162:162/udp"
    volumes:
      - app-data:/data
      - rrd-data:/data/rrd
    networks: [backend]

  # Gateway video internal untuk live view & snapshot CCTV (tidak ada port yang dibuka ke luar)
  go2rtc:
    image: alexxit/go2rtc:${GO2RTC_VERSION:-1.9.9}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    # Konfigurasi dasar dibaca dari file read-only lalu disalin ke /config di memori (tmpfs):
    # stream yang didaftarkan ANTAREJA (berisi kredensial NVR) tidak pernah tertulis ke disk.
    command: ["sh", "-c", "cp /etc/antareja/go2rtc.yaml /config/go2rtc.yaml && exec go2rtc -config /config/go2rtc.yaml"]
    tmpfs:
      - /config:size=8m,mode=0700
    volumes:
      - ./go2rtc/go2rtc.yaml:/etc/antareja/go2rtc.yaml:ro
    networks: [backend]

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      go2rtc:
        condition: service_started
    environment:
      TZ: ${TZ}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/antareja.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [backend]

networks:
  backend:
    name: antareja-backend
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.250.0/24}

volumes:
  db-data:
  redis-data:
  rrd-data:
  rrd-journal:
  app-data:
